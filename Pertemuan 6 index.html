<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Konvolusi & Histogram Equalization RGB</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .channel-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .channel-block {
            text-align: center;
        }
        canvas {
            border: 1px solid #000;
            margin-top: 5px;
        }
        #resolution {
            margin-top: 10px;
        }
        button {
            margin-top: 5px;
            margin-right: 5px;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .hist-container {
            display: none;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .hist-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hist-tables {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        table {
            border-collapse: collapse;
            width: 130px;
            font-size: 11px;
        }
        th, td {
            border: 1px solid #444;
            padding: 2px 4px;
            text-align: center;
        }
        th {
            background-color: #eee;
        }
    </style>
</head>
<body>

    <h3>Konvolusi & Histogram Equalization RGB</h3>
    <canvas id="gambar" width="300" height="300"></canvas><br>
    <input type="file" id="file1" accept=".jpg, .jpeg, .png, .bmp"><br>
    <div id="resolution"></div>
    <button id="convBtn" onclick="applyConvolution()" disabled>Konvolusi</button>
    <button id="histBtn" onclick="histogramEqualizationRGB()" disabled>Histogram Equalization RGB</button>

    <div id="channels" class="channel-container"></div>

    <div id="histContainer" class="hist-container">
        <div class="hist-section">
            <h4>Histogram Sebelum (RGB)</h4>
            <canvas id="histBefore" width="256" height="120"></canvas>
            <div class="hist-tables">
                <div id="tableBeforeR"></div>
                <div id="tableBeforeG"></div>
                <div id="tableBeforeB"></div>
            </div>
        </div>
        <div class="hist-section">
            <h4>Histogram Sesudah (RGB)</h4>
            <canvas id="histAfter" width="256" height="120"></canvas>
            <div class="hist-tables">
                <div id="tableAfterR"></div>
                <div id="tableAfterG"></div>
                <div id="tableAfterB"></div>
            </div>
        </div>
    </div>

    <script>
        let originalImage = null;
        let width = 0, height = 0;

        document.getElementById("file1").addEventListener("change", function () {
            loadImage(this, "gambar");
        });

        function loadImage(fileInput, canvasId) {
            const file = fileInput.files[0];
            if (!file) return;

            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");
            const img = new Image();

            img.onload = function () {
                canvas.width = img.width;
                canvas.height = img.height;
                width = img.width;
                height = img.height;
                ctx.drawImage(img, 0, 0);
                originalImage = img;

                document.getElementById("convBtn").disabled = false;
                document.getElementById("histBtn").disabled = false;
                document.getElementById("resolution").textContent = `Resolution: ${img.width} x ${img.height}`;

                clearChannels();
                document.getElementById("histContainer").style.display = "none";
            };

            img.src = URL.createObjectURL(file);
        }

        function clearChannels() {
            document.getElementById("channels").innerHTML = "";
        }

        function createChannelCanvas(label, imgData) {
            const container = document.getElementById("channels");
            const block = document.createElement("div");
            block.className = "channel-block";

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.putImageData(imgData, 0, 0);

            const caption = document.createElement("p");
            caption.textContent = label;

            block.appendChild(canvas);
            block.appendChild(caption);
            container.appendChild(block);
        }

        function applyConvolution() {
            if (!originalImage) return;
            clearChannels();
            document.getElementById("histContainer").style.display = "none";

            const canvas = document.getElementById("gambar");
            const ctx = canvas.getContext("2d");
            const imgData = ctx.getImageData(0, 0, width, height);

            const kernel = [
                [0, 1, 0],
                [1, 5, 1],
                [0, 1, 0]
            ];
            const kSize = 3;
            const offset = Math.floor(kSize / 2);
            const newImgData = ctx.createImageData(width, height);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let r = 0, g = 0, b = 0;

                    for (let ky = 0; ky < kSize; ky++) {
                        for (let kx = 0; kx < kSize; kx++) {
                            const px = Math.min(width - 1, Math.max(0, x + kx - offset));
                            const py = Math.min(height - 1, Math.max(0, y + ky - offset));
                            const i = (py * width + px) * 4;

                            r += imgData.data[i] * kernel[ky][kx];
                            g += imgData.data[i + 1] * kernel[ky][kx];
                            b += imgData.data[i + 2] * kernel[ky][kx];
                        }
                    }

                    const i = (y * width + x) * 4;
                    newImgData.data[i] = Math.min(Math.max(r, 0), 255);
                    newImgData.data[i + 1] = Math.min(Math.max(g, 0), 255);
                    newImgData.data[i + 2] = Math.min(Math.max(b, 0), 255);
                    newImgData.data[i + 3] = 255;
                }
            }

            createChannelCanvas("Konvolusi", newImgData);
        }

        function histogramEqualizationRGB() {
            if (!originalImage) return;
            clearChannels();

            const canvas = document.getElementById("gambar");
            const ctx = canvas.getContext("2d");
            const imgData = ctx.getImageData(0, 0, width, height);
            const totalPixels = width * height;

            // 1. Inisialisasi histogram sebelum
            const histBeforeR = new Array(256).fill(0);
            const histBeforeG = new Array(256).fill(0);
            const histBeforeB = new Array(256).fill(0);

            for (let i = 0; i < imgData.data.length; i += 4) {
                histBeforeR[imgData.data[i]]++;
                histBeforeG[imgData.data[i + 1]]++;
                histBeforeB[imgData.data[i + 2]]++;
            }

            // Tampilkan grafik dan tabel histogram sebelum
            document.getElementById("histContainer").style.display = "flex";
            drawHistogramRGB(histBeforeR, histBeforeG, histBeforeB, "histBefore");
            drawTable(histBeforeR, "tableBeforeR", "R");
            drawTable(histBeforeG, "tableBeforeG", "G");
            drawTable(histBeforeB, "tableBeforeB", "B");

            // 2. Hitung CDF untuk setiap kanal
            const cdfR = [], cdfG = [], cdfB = [];
            let sumR = 0, sumG = 0, sumB = 0;

            for (let i = 0; i < 256; i++) {
                sumR += histBeforeR[i];
                sumG += histBeforeG[i];
                sumB += histBeforeB[i];

                cdfR.push(sumR / totalPixels);
                cdfG.push(sumG / totalPixels);
                cdfB.push(sumB / totalPixels);
            }

            // 3. Petakan piksel baru & hitung histogram sesudah
            const newImgData = ctx.createImageData(width, height);
            const histAfterR = new Array(256).fill(0);
            const histAfterG = new Array(256).fill(0);
            const histAfterB = new Array(256).fill(0);

            for (let i = 0; i < imgData.data.length; i += 4) {
                const valR = Math.round(cdfR[imgData.data[i]] * 255);
                const valG = Math.round(cdfG[imgData.data[i + 1]] * 255);
                const valB = Math.round(cdfB[imgData.data[i + 2]] * 255);

                newImgData.data[i]     = valR;
                newImgData.data[i + 1] = valG;
                newImgData.data[i + 2] = valB;
                newImgData.data[i + 3] = 255;

                histAfterR[valR]++;
                histAfterG[valG]++;
                histAfterB[valB]++;
            }

            // Tampilkan hasil citra warna, grafik, dan tabel histogram sesudah
            createChannelCanvas("Histogram Equalization RGB", newImgData);
            drawHistogramRGB(histAfterR, histAfterG, histAfterB, "histAfter");
            drawTable(histAfterR, "tableAfterR", "R");
            drawTable(histAfterG, "tableAfterG", "G");
            drawTable(histAfterB, "tableAfterB", "B");
        }

        // Fungsi menggambar kurva histogram RGB bersamaan
        function drawHistogramRGB(histR, histG, histB, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const maxVal = Math.max(...histR, ...histG, ...histB);

            // Red Channel
            ctx.strokeStyle = "rgba(255, 0, 0, 0.6)";
            ctx.beginPath();
            for (let i = 0; i < 256; i++) {
                const h = (histR[i] / maxVal) * canvas.height;
                ctx.moveTo(i, canvas.height);
                ctx.lineTo(i, canvas.height - h);
            }
            ctx.stroke();

            // Green Channel
            ctx.strokeStyle = "rgba(0, 200, 0, 0.6)";
            ctx.beginPath();
            for (let i = 0; i < 256; i++) {
                const h = (histG[i] / maxVal) * canvas.height;
                ctx.moveTo(i, canvas.height);
                ctx.lineTo(i, canvas.height - h);
            }
            ctx.stroke();

            // Blue Channel
            ctx.strokeStyle = "rgba(0, 0, 255, 0.6)";
            ctx.beginPath();
            for (let i = 0; i < 256; i++) {
                const h = (histB[i] / maxVal) * canvas.height;
                ctx.moveTo(i, canvas.height);
                ctx.lineTo(i, canvas.height - h);
            }
            ctx.stroke();
        }

        // Fungsi untuk merender tabel frekuensi
        function drawTable(hist, containerId, channelLabel) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";

            let table = `<table><tr><th>Pixel</th><th>Freq (${channelLabel})</th></tr>`;
            for (let i = 0; i < hist.length; i++) {
                table += `<tr><td>${i}</td><td>${hist[i]}</td></tr>`;
            }
            table += "</table>";
            container.innerHTML = table;
        }
    </script>
</body>
</html>
